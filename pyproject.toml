[project]
name = "space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BashCtl" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
space = "space:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
